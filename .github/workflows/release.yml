name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the bundle exists
        run: test -s dist/tessera-sip-card.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tessera-sip-card.js
            dist/tessera-sip-card.js.map
          generate_release_notes: true
