<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder porch still for the demo">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8071"/>
      <stop offset=".55" stop-color="#736657"/>
      <stop offset="1" stop-color="#554a40"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e2c22"/>
      <stop offset=".45" stop-color="#573d29"/>
      <stop offset="1" stop-color="#33241b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea1a8"/>
      <stop offset=".45" stop-color="#4c6068"/>
      <stop offset="1" stop-color="#232e33"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f7365"/>
      <stop offset="1" stop-color="#564c42"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd79c" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#f4b96a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f4b96a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".72">
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".24"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".22"/>
      </feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect width="1200" height="800" filter="url(#mottle)" opacity=".5"/>

  <!-- stone joints -->
  <g stroke="#120f0c" stroke-opacity=".16" stroke-width="2">
    <path d="M0 268h1200M0 520h1200M0 664h1200"/>
    <path d="M120 0v268M540 0v268M960 0v268M300 268v252M760 268v252M60 520v144M620 520v144M1080 520v144"/>
  </g>

  <!-- floor and threshold -->
  <rect y="664" width="1200" height="136" fill="url(#floor)"/>
  <rect y="660" width="1200" height="10" fill="#8d8275" opacity=".5"/>
  <ellipse cx="604" cy="724" rx="208" ry="30" fill="#241f1a" opacity=".45"/>

  <!-- door surround -->
  <rect x="404" y="70" width="392" height="600" rx="10" fill="#2c211a"/>
  <rect x="420" y="86" width="360" height="584" rx="5" fill="url(#wood)"/>

  <!-- door panels -->
  <g fill="#1b1310" opacity=".66">
    <rect x="452" y="126" width="128" height="196" rx="3"/>
    <rect x="620" y="126" width="128" height="196" rx="3"/>
    <rect x="452" y="356" width="128" height="264" rx="3"/>
    <rect x="620" y="356" width="128" height="264" rx="3"/>
  </g>
  <g fill="#6a5138" opacity=".22">
    <rect x="452" y="126" width="128" height="4" rx="2"/>
    <rect x="620" y="126" width="128" height="4" rx="2"/>
    <rect x="452" y="356" width="128" height="4" rx="2"/>
    <rect x="620" y="356" width="128" height="4" rx="2"/>
  </g>
  <g stroke="#1c1410" stroke-opacity=".55" stroke-width="3">
    <path d="M470 96v566M520 96v566M590 96v566M630 96v566M700 96v566M740 96v566"/>
  </g>
  <circle cx="744" cy="384" r="7" fill="#c8a672"/>
  <circle cx="744" cy="384" r="2.4" fill="#6d5836"/>

  <!-- sidelights -->
  <g>
    <rect x="306" y="140" width="76" height="456" rx="5" fill="#2c211a"/>
    <rect x="314" y="148" width="60" height="440" rx="3" fill="url(#glass)" opacity=".72"/>
    <rect x="342" y="148" width="3" height="440" fill="#241f1a" opacity=".7"/>
    <rect x="314" y="368" width="60" height="3" fill="#241f1a" opacity=".7"/>
    <rect x="818" y="140" width="76" height="456" rx="5" fill="#2c211a"/>
    <rect x="826" y="148" width="60" height="440" rx="3" fill="url(#glass)" opacity=".6"/>
    <rect x="854" y="148" width="3" height="440" fill="#241f1a" opacity=".7"/>
    <rect x="826" y="368" width="60" height="3" fill="#241f1a" opacity=".7"/>
    <path d="M826 148l60 150v34l-60-150Z" fill="#ffffff" opacity=".03"/>
  </g>

  <!-- porch lamp -->
  <ellipse cx="978" cy="252" rx="260" ry="250" fill="url(#glow)"/>
  <g>
    <rect x="960" y="196" width="36" height="86" rx="14" fill="#31251c"/>
    <rect x="968" y="204" width="20" height="70" rx="10" fill="#f6d9a6" opacity=".9"/>
    <rect x="972" y="214" width="12" height="50" rx="6" fill="#fff3d8" opacity=".35" filter="url(#soft)"/>
  </g>
  <ellipse cx="978" cy="600" rx="120" ry="34" fill="#f0bd76" opacity=".14" filter="url(#soft)"/>

  <!-- cool light spill from the left -->
  <ellipse cx="120" cy="180" rx="340" ry="260" fill="#a9c6d4" opacity=".14" filter="url(#soft)"/>

  <rect width="1200" height="800" fill="url(#vignette)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".04" style="mix-blend-mode:overlay"/>
</svg>
