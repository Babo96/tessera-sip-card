<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tessera SIP Card — demo</title>
    <style>
      :root {
        color-scheme: light;
        --page: #e9e6df;
        --page-glow: #fdfbf7;
        --fg: #17191d;
        --muted: #626974;
        --panel: #ffffff;
        --panel-border: rgb(20 24 30 / 9%);
        --bezel: #26292e;
        --bezel-edge: rgb(255 255 255 / 16%);
        --screen: #f2efe9;
        --screen-glow: #fbf9f4;
        --shadow: 0 34px 90px rgb(48 42 32 / 20%);
        --accent: #2f7fe0;
        --accent-ink: #ffffff;
        --hover: rgb(20 24 30 / 5%);
        --font:
          ui-rounded, "SF Pro Rounded", "Avenir Next", "Nunito", "Quicksand", "Varela Round",
          "Segoe UI Variable Display", "Ubuntu", system-ui, sans-serif;

        /* Home Assistant theme stand-ins, inherited into the card's shadow DOM. */
        --primary-text-color: #17191d;
        --secondary-text-color: #626974;
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --primary-color: #2f7fe0;
        --accent-color: #2f7fe0;
        --error-color: #c94339;
        --success-color: #2f9e64;
        --divider-color: rgb(20 24 30 / 10%);
        --ha-card-box-shadow: 0 12px 30px rgb(30 32 38 / 10%);
        --ha-card-border-radius: 28px;
        --ha-font-family-body: var(--font);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0b0d0f;
        --page-glow: #161a1e;
        --fg: #f2f4f7;
        --muted: #9aa3ad;
        --panel: #171a1e;
        --panel-border: rgb(255 255 255 / 9%);
        --bezel: #050607;
        --bezel-edge: rgb(255 255 255 / 12%);
        --screen: #0e1013;
        --screen-glow: #171b1f;
        --shadow: 0 34px 100px rgb(0 0 0 / 65%);
        --accent: #6aa8ff;
        --accent-ink: #0b1018;
        --hover: rgb(255 255 255 / 7%);

        --primary-text-color: #f2f4f7;
        --secondary-text-color: #9aa3ad;
        --card-background-color: #1b1e22;
        --ha-card-background: #1b1e22;
        --primary-color: #6aa8ff;
        --accent-color: #6aa8ff;
        --error-color: #ff6f66;
        --success-color: #5fca92;
        --divider-color: rgb(255 255 255 / 12%);
        --ha-card-box-shadow: 0 14px 34px rgb(0 0 0 / 45%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 26px 72px;
        background:
          radial-gradient(90% 55% at 50% -12%, var(--page-glow) 0%, transparent 62%),
          var(--page);
        color: var(--fg);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
        max-width: 1120px;
        margin: 0 auto 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        display: grid;
        flex: none;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 18px;
        background: var(--panel);
        box-shadow:
          0 10px 24px rgb(30 32 38 / 10%),
          inset 0 0 0 1px var(--panel-border);
        color: var(--accent);
      }

      .mark svg {
        width: 27px;
        height: 27px;
      }

      h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }

      .lead {
        max-width: 52ch;
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        font: inherit;
      }

      .tools button {
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--fg);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.16s ease,
          border-color 0.16s ease,
          transform 0.16s ease;
      }

      .tools button:hover {
        border-color: color-mix(in srgb, var(--fg) 26%, transparent);
      }

      .tools button[aria-pressed="true"] {
        border-color: transparent;
        background: var(--fg);
        color: var(--page);
      }

      .tools button:active {
        transform: scale(0.97);
      }

      .tools button:focus-visible,
      .bar button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .bar {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
        max-width: 1120px;
        margin: 0 auto 32px;
        padding: 12px 16px;
        border: 1px solid var(--panel-border);
        border-radius: 22px;
        background: color-mix(in srgb, var(--panel) 82%, transparent);
        box-shadow: 0 14px 30px rgb(30 32 38 / 7%);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      .bar-title {
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .group-label {
        margin-right: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }

      .group button {
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--hover);
        color: var(--fg);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.16s ease,
          border-color 0.16s ease,
          color 0.16s ease;
      }

      .group button:hover {
        border-color: var(--panel-border);
      }

      .group button.is-active {
        border-color: transparent;
        background: var(--fg);
        color: var(--page);
      }

      .group button[data-sim="registered"].is-active {
        background: #2f9e64;
        color: #fff;
      }

      .group button[data-sim="incoming"].is-active {
        background: #e2943a;
        color: #241a0c;
      }

      .group button[data-sim="error"].is-active,
      .group button[data-sim="unregistered"].is-active {
        background: #c94339;
        color: #fff;
      }

      .bar .group.reset {
        margin-left: auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 40px 30px;
        max-width: 1120px;
        margin: 0 auto;
        align-items: start;
      }

      .stage {
        display: grid;
        justify-items: center;
        gap: 13px;
        min-width: 0;
      }

      .stage[data-stage="wide"],
      .stage[data-stage="panel"] {
        grid-column: 1 / -1;
      }

      .stage h2 {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin: 0;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .stage h2 span {
        color: color-mix(in srgb, var(--muted) 62%, transparent);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.02em;
        text-transform: none;
      }

      .device {
        position: relative;
        width: 100%;
        max-width: 100%;
        padding: 11px;
        border-radius: 40px;
        background:
          linear-gradient(155deg, rgb(255 255 255 / 14%), transparent 30%),
          linear-gradient(170deg, var(--bezel) 0%, color-mix(in srgb, var(--bezel) 70%, #000) 100%);
        box-shadow:
          var(--shadow),
          inset 0 0 0 1px var(--bezel-edge);
      }

      .device::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 35px;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 35%);
        pointer-events: none;
      }

      .screen {
        position: relative;
        overflow: hidden;
        padding: 16px;
        border-radius: 30px;
        background:
          radial-gradient(100% 70% at 18% 0%, var(--screen-glow) 0%, transparent 65%),
          var(--screen);
        box-shadow: inset 0 0 30px rgb(0 0 0 / 14%);
      }

      .device.small {
        width: 360px;
        max-width: 360px;
      }

      .device.square {
        width: 462px;
        max-width: 462px;
      }

      .device.wide {
        width: 100%;
        max-width: 960px;
      }

      .device.panel {
        width: 532px;
        max-width: 532px;
        border-radius: 30px;
        padding: 12px;
      }

      .device.panel .screen {
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 800px;
        padding: 16px;
        border-radius: 22px;
      }

      .panel-note {
        display: grid;
        flex: 1;
        place-items: center;
        padding: 20px;
        border: 1px dashed color-mix(in srgb, var(--fg) 16%, transparent);
        border-radius: 22px;
        color: color-mix(in srgb, var(--fg) 38%, transparent);
        font-size: 12px;
        text-align: center;
      }

      .log {
        max-width: 1120px;
        margin: 34px auto 0;
        color: color-mix(in srgb, var(--muted) 82%, transparent);
        font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }

      [hidden] {
        display: none !important;
      }

      /* Screenshot mode: one centred device, no chrome. */
      body[data-only] {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 26px;
      }

      body[data-only] .top,
      body[data-only] header,
      body[data-only] .bar,
      body[data-only] #controls,
      body[data-only] .log,
      body[data-only] .stage > h2 {
        display: none;
      }

      body[data-only] .grid {
        display: block;
        width: 100%;
        max-width: 1020px;
        margin: 0;
      }

      body[data-only] .stage {
        display: block;
      }

      body[data-only] .device {
        margin: 0 auto;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        body {
          padding: 24px 14px 56px;
        }
        .brand {
          align-items: flex-start;
        }
        .device.small,
        .device.square,
        .device.panel {
          width: 100%;
        }
        .device.panel .screen {
          height: 640px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.1 2.9h5.8a3.3 3.3 0 0 1 3.3 3.3v11.6a3.3 3.3 0 0 1-3.3 3.3H9.1a3.3 3.3 0 0 1-3.3-3.3V6.2a3.3 3.3 0 0 1 3.3-3.3Z" />
            <path d="M14.4 8.6a2.4 2.4 0 1 1-4.8 0 2.4 2.4 0 0 1 4.8 0Z" />
            <path d="M12 14.7v1.9" />
          </svg>
        </span>
        <div>
          <h1>Tessera SIP</h1>
          <p class="lead">
            A doorbell tile for Home Assistant. A fake PBX drives every state — no account, no
            network, no audio.
          </p>
        </div>
      </div>

      <div class="tools">
        <button type="button" data-theme-toggle>Dark</button>
        <button type="button" data-lang-toggle aria-label="Switch language to German">DE</button>
        <button type="button" data-camera-toggle aria-pressed="false">Camera</button>
      </div>
    </header>

    <nav class="bar" id="controls" aria-label="Simulate SIP states">
      <span class="bar-title">Simulate</span>
      <div class="group">
        <span class="group-label">Line</span>
        <button type="button" data-sim="registered">Online</button>
        <button type="button" data-sim="registering">Boot</button>
        <button type="button" data-sim="unregistered">Offline</button>
        <button type="button" data-sim="error">Error</button>
      </div>
      <div class="group">
        <span class="group-label">Doorbell</span>
        <button type="button" data-sim="incoming">Ring</button>
        <button type="button" data-sim="audio-blocked">Sound tap</button>
      </div>
      <div class="group">
        <span class="group-label">In call</span>
        <button type="button" data-sim="outgoing">Call</button>
        <button type="button" data-sim="connected">Answered</button>
        <button type="button" data-sim="muted">Mute</button>
      </div>
      <div class="group">
        <span class="group-label">End</span>
        <button type="button" data-sim="ended">Hang up</button>
        <button type="button" data-sim="declined">Decline</button>
      </div>
      <div class="group reset">
        <button type="button" data-sim="reset">Reset</button>
      </div>
    </nav>

    <main class="grid">
      <section class="stage" data-stage="tile">
        <h2>1 × 2 tile <span>≈ 300 px</span></h2>
        <div class="device small">
          <div class="screen"><tessera-sip-card id="card-small"></tessera-sip-card></div>
        </div>
      </section>

      <section class="stage" data-stage="square">
        <h2>2 × 2 tile <span>≈ 400 px</span></h2>
        <div class="device square">
          <div class="screen"><tessera-sip-card id="card-square"></tessera-sip-card></div>
        </div>
      </section>

      <section class="stage" data-stage="wide">
        <h2>Full width <span>≈ 900 px</span></h2>
        <div class="device wide">
          <div class="screen"><tessera-sip-card id="card-wide"></tessera-sip-card></div>
        </div>
      </section>

      <section class="stage" data-stage="panel">
        <h2>Wall panel <span>480 × 800</span></h2>
        <div class="device panel">
          <div class="screen">
            <tessera-sip-card id="card-panel"></tessera-sip-card>
            <div class="panel-note">The rest of the dashboard scrolls underneath.</div>
          </div>
        </div>
      </section>
    </main>

    <div class="log" id="log"></div>

    <script type="module" src="/demo/demo.ts"></script>
  </body>
</html>
