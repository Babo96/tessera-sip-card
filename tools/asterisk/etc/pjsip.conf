[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[100]
type=endpoint
transport=transport-ws
context=from-internal
disallow=all
allow=ulaw,alaw
webrtc=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
media_use_received_transport=yes
dtls_auto_generate_cert=yes
auth=100
aors=100
callerid="Test card" <100>

[100]
type=auth
auth_type=userpass
username=100
password=test

[100]
type=aor
max_contacts=2
remove_existing=yes

; A plain SIP endpoint for the ESP panel (no WebRTC/ICE/SRTP).
[transport-udp-lan]
type=transport
protocol=udp
bind=0.0.0.0:5062

[1003]
type=endpoint
transport=transport-udp-lan
context=from-internal
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=1003
aors=1003
callerid="Gang" <1003>

[1003]
type=auth
auth_type=userpass
username=1003
password=test

[1003]
type=aor
max_contacts=1
remove_existing=yes
