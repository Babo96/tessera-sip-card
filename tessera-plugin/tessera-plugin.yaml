# SIP doorbell: a native SIP phone on the panel. The ESP32-P4 registers to the PBX, carries the audio itself and
# draws a door tile plus a full-screen call card. The browser tessera-sip-card stays a separate dashboard fallback.
id: sip_doorbell
version: 0.2.1
# Cards and popups (0.18) are the newest parts used; every other call is older.
api: "0.18"
icon: doorbell
maintainer: Babo96
license: MIT
stage: beta
topics: [home, tech]
requires:
  esphome: 2026.6.2
  psram: true
  features: [microphone, speaker]
boards: any
flash_kb: 500

inputs:
  - { id: sip_server, kind: text, label: input_sip_server, hint: input_sip_server_hint }
  - { id: sip_port, kind: text, label: input_sip_port, hint: input_sip_port_hint }
  - { id: sip_user, kind: text, label: input_sip_user, hint: input_sip_user_hint }
  - { id: sip_password, kind: text, label: input_sip_password, hint: input_sip_password_hint }
  - { id: sip_domain, kind: text, label: input_sip_domain, hint: input_sip_domain_hint }
  - { id: sip_caller, kind: text, label: input_sip_caller, hint: input_sip_caller_hint }
  - { id: sip_transport, kind: text, label: input_sip_transport, hint: input_sip_transport_hint }

cards:
  - { id: call, name: card_name, wide: true }

tiles:
  - id: door
    name: tile_name
    icon: doorbell
    sizes: { min: 1x1, max: 2x2 }
    memory: 1000
    example: tile_example
    options:
      - { id: target, kind: text, default: "555", label: option_target, hint: option_target_hint }
      - { id: station, kind: text, default: "8000", label: option_station, hint: option_station_hint }

settings:
  - { key: auto_answer, label: setting_auto_answer, hint: setting_auto_answer_hint }
  - { key: ring_popup, label: setting_ring_popup, hint: setting_ring_popup_hint }
